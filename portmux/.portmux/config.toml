[general]
session_name = "portmux"
default_identity = "~/Projects/Secrets/secrets/secret.ssh_keys/bastion/id_rsa"
reconnect_delay = 1
max_retries = 3

[monitor]
enabled = true
check_interval = 5
auto_reconnect = true

[startup]
auto_execute = true
commands = [
  "portmux add L 3000:localhost:3000 x@newbox",
  "portmux add L 8000:localhost:8000 x@newbox",
  "portmux add R 43022:localhost:22 x@newbox",
]

[profiles.development]
session_name = "portmux-dev"
default_identity = "~/Projects/Secrets/secrets/secret.ssh_keys/bastion/id_rsa"
commands = []

[profiles.production]
session_name = "portmux-prod"
default_identity = "~/Projects/Secrets/secrets/secret.ssh_keys/bastion/id_rsa"
commands = []
